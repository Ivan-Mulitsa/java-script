<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<TITLE>Zadanie 36 - Mulitsa</TITLE>
</head>
<body>
<script language="JavaScript">
var x_mul = prompt("Podaj liczbę:", "");
var liczba_mul = parseFloat(x_mul);
if(liczba_mul % 2 == 0)
{
document.write("<font color=red size=3>liczba jest parzysta</font>");
}
else
{
document.write("<font color=silver size=5>liczba jest nieparzysta</font>");
}
</script>
</body>
</html>
