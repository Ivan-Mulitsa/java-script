<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<TITLE>Zadanie 44 - Mulitsa</TITLE>
</head>
<body>
<script language="JavaScript">
var ile_razy_mul = 13;
var wielkosc_mul = 44;
document.write("ilość wykonania pętli = " + ile_razy_mul + "<br>");
document.write("wielkość liter = " + wielkosc_mul + "px<br>");
for(i_mul=1;i_mul<=ile_razy_mul;i_mul++)
{
if(i_mul % 2 == 1)
{
document.write("<p style=\"font-size:" + wielkosc_mul + "px;\">Mulitsa</p>");
}
else
{
document.write("<p style=\"font-size:" + wielkosc_mul + "px;\">Ivan</p>");
}
}
</script>
</body>
</html>
