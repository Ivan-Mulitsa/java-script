<html>
 <body>
 <textarea cols="90" rows="24">
<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<TITLE>Zadanie 55 - Mulitsa</TITLE>
</head>
<body>
<script language="JavaScript">
var l1_t_mul, l2_t_mul;

do {
    l1_t_mul = parseFloat(prompt("Podaj pierwszą liczbę z przedziału <20,60>:", ""));
    if(l1_t_mul < 20 || l1_t_mul > 60)
    {
        alert("liczba l1 nie należy do przedziału <20,60>");
    }
} while(l1_t_mul < 20 || l1_t_mul > 60);

do {
    l2_t_mul = parseFloat(prompt("Podaj drugą liczbę z przedziału <20,60>:", ""));
    if(l2_t_mul < 20 || l2_t_mul > 60)
    {
        alert("liczba l2 nie należy do przedziału <20,60>");
    }
} while(l2_t_mul < 20 || l2_t_mul > 60);

var pocz_mul = parseFloat(prompt("Podaj wartość początkową wielkości tekstu:", ""));
var tekst_mul = prompt("Podaj dowolny tekst:", "");
var i_mul = pocz_mul;

if(l1_t_mul < l2_t_mul)
{
    while(i_mul <= 100)
    {
        document.write("<p style=\"font-size:"+i_mul+"px; color: black;\">"+tekst_mul+"</p>");
        i_mul = i_mul + 5;
    }
}
else if(l2_t_mul < l1_t_mul)
{
    while(i_mul >= 0)
    {
        document.write("<p style=\"font-size:"+i_mul+"px; color: black;\">"+tekst_mul+"</p>");
        i_mul = i_mul - 5;
    }
}
else
{
    document.write("<p style=\"font-size:"+i_mul+"px; color: black;\">"+tekst_mul+"</p>");
}
</script>
</body>
</html>

 </textarea>
 </body>
</html>
